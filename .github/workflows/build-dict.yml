name: build-i18n-dict

# 北京时间周一 00:00 == UTC 周日 16:00
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4

      - name: Download latest VM dictionary
        run: |
          mkdir -p vm
          curl -L --fail -o vm/Dict.json \
            https://github.com/VM-Chinese-translate-group/i18n-Dict-Extender/releases/latest/download/Dict.json

      - name: Restore previous dictionary assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          PREV_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(any(.assets[]; .name == "manifest.json"))][0].tag_name // empty')"
          if [ -n "$PREV_TAG" ]; then
            echo "restoring assets from $PREV_TAG"
            gh release download "$PREV_TAG" --pattern '*.zst' --dir dist --clobber || true
            gh release download "$PREV_TAG" --pattern 'manifest.json' --dir dist --clobber || true
          fi

      - name: Install zstandard
        run: python -m pip install --upgrade zstandard

      - name: Build artifacts
        run: |
          TAG="$(date -u -d '+8 hours' +%Y-%m-%d)"
          python3 build_dict.py \
            --vm-dict vm/Dict.json \
            --own-dict sources/own-dict.json \
            --out dist \
            --tag "$TAG" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(date -u -d '+8 hours' +%Y-%m-%d)"
          if [ ! -f dist/manifest.json ]; then
            echo "manifest missing; nothing to publish"
            exit 0
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --title "增强词典 $TAG" \
            --prerelease \
            --notes "每周一 00:00 (北京时间) 自动构建。VM 词条优先于自有汉化库。"

      - name: Sync manifest to main
        run: |
          if [ ! -f dist/manifest.json ]; then
            exit 0
          fi
          cp dist/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -m "chore: 更新词典 manifest"
          git push
